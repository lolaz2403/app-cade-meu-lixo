<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa em Tempo Real - E Cadê Meu Lixo?</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --azul-escuro: #0b4f8a;
      --azul-vibrante: #0077cc;
      --verde-principal: #239b3b;
      --verde-claro: #e6f6ea;
      --branco: #ffffff;
      --texto: #1e354d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--azul-escuro) 0%, #1565a8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 1120px;
      min-height: 640px;
      background: var(--branco);
      border-radius: 18px;
      box-shadow: 0 24px 50px rgba(0, 25, 55, 0.35);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 2px solid #eef4f8;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-left img {
      height: 44px;
    }

    .header-left h2 {
      font-size: 1.2rem;
      color: var(--azul-escuro);
    }

    .btn-voltar {
      background: transparent;
      border: 2px solid var(--azul-vibrante);
      color: var(--azul-vibrante);
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-voltar:hover {
      background: var(--azul-vibrante);
      color: var(--branco);
    }

    /* Área principal dividida */
    .content {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
    }

    /* Painel lateral de status */
    .sidebar {
      padding: 24px;
      background: #f8fbfe;
      border-right: 2px solid #eef4f8;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .search-box label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--azul-escuro);
      margin-bottom: 6px;
    }

    .search-box input {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #cfe0ee;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--verde-principal);
    }

    .status-card {
      background: var(--branco);
      border-left: 5px solid var(--verde-principal);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(11, 79, 138, 0.08);
    }

    .badge {
      display: inline-block;
      background: var(--verde-claro);
      color: var(--verde-principal);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    .status-card h3 {
      font-size: 1.35rem;
      color: var(--azul-escuro);
      margin-bottom: 4px;
    }

    .status-card p {
      font-size: 0.88rem;
      color: #556b82;
    }

    .btn-alerta {
      margin-top: auto;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--verde-principal), var(--azul-vibrante));
      color: var(--branco);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-alerta:hover {
      filter: brightness(1.07);
    }

    /* Área do Mapa Simulado */
    .map-area {
      position: relative;
      background: #e9f2ea;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    svg.mapa-vetor {
      width: 100%;
      height: 100%;
      min-height: 500px;
    }

    @media (max-width: 820px) {
      .content {
        grid-template-columns: 1fr;
      }
      .sidebar {
        border-right: none;
        border-bottom: 2px solid #eef4f8;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <img src="logo.png" alt="Logo E Cadê Meu Lixo?" />
        <h2>Rastreamento da Coleta</h2>
      </div>
      <button class="btn-voltar" onclick="window.location.href='index.html'">← Voltar</button>
    </header>

    <div class="content">
      <aside class="sidebar">
        <div class="search-box">
          <label for="rua">Seu endereço:</label>
          <input type="text" id="rua" value="Av. Principal, 450 - Centro" />
        </div>

        <div class="status-card">
          <span class="badge" id="status-badge">● EM ROTA AGORA</span>
          <h3 id="tempo-estimado">Chega em 4 min</h3>
          <p id="distancia-texto">O caminhão está a 350 metros do seu ponto.</p>
        </div>

        <div class="status-card" style="border-left-color: var(--azul-vibrante);">
          <strong style="color: var(--azul-escuro); font-size: 0.9rem;">Dias de Coleta:</strong>
          <p style="margin-top: 4px;">Segunda, Quarta e Sexta • 19h00 às 21h00</p>
        </div>

        <button class="btn-alerta" id="btn-notificar" onclick="ativarAlerta()">
          🔔 Avisar quando estiver perto
        </button>
      </aside>

      <div class="map-area">
        <svg class="mapa-vetor" viewBox="0 0 800 540" preserveAspectRatio="xMidYMid slice">
          <rect x="0" y="0" width="800" height="540" fill="#eef4f0" />
          <rect x="40" y="40" width="210" height="140" rx="16" fill="#cde8d3" />
          <rect x="290" y="40" width="230" height="140" rx="16" fill="#dce6ec" />
          <rect x="560" y="40" width="200" height="140" rx="16" fill="#cde8d3" />

          <rect x="40" y="220" width="210" height="130" rx="16" fill="#dce6ec" />
          <rect x="290" y="220" width="230" height="130" rx="16" fill="#cde8d3" />
          <rect x="560" y="220" width="200" height="130" rx="16" fill="#dce6ec" />

          <rect x="40" y="390" width="340" height="115" rx="16" fill="#cde8d3" />
          <rect x="420" y="390" width="340" height="115" rx="16" fill="#dce6ec" />

          <!-- Rota azul -->
          <path id="rota-caminhao"
                d="M 110 440 L 270 440 L 270 200 L 540 200 L 540 110 L 660 110"
                fill="none"
                stroke="#0077cc"
                stroke-width="12"
                stroke-linecap="round"
                stroke-linejoin="round" />

          <!-- Ponto inicial -->
          <circle cx="110" cy="440" r="11" fill="#ffffff" stroke="#0077cc" stroke-width="5" />

          <!-- Pino vermelho de destino -->
          <g transform="translate(660, 110)">
            <path d="M0 -48 C-16 -48 -28 -36 -28 -20 C-28 0 0 22 0 22 C0 22 28 0 28 -20 C28 -36 16 -48 0 -48 Z" fill="#e63946" />
            <circle cx="0" cy="-22" r="9" fill="#ffffff" />
          </g>

          <!-- Caminhão de lixo animado -->
          <g id="caminhao-marker" transform="translate(110, 440)">
            <circle cx="0" cy="0" r="24" fill="#239b3b" stroke="#ffffff" stroke-width="4" />
            <rect x="-13" y="-9" width="17" height="14" rx="2" fill="#ffffff" />
            <rect x="4" y="-5" width="9" height="10" rx="2" fill="#cbe8ff" />
            <circle cx="-7" cy="8" r="3.5" fill="#1e354d" />
            <circle cx="7" cy="8" r="3.5" fill="#1e354d" />
          </g>
        </svg>
      </div>
    </div>
  </div>

  <script>
    const caminho = document.getElementById('rota-caminhao');
    const caminhao = document.getElementById('caminhao-marker');
    const tempoTexto = document.getElementById('tempo-estimado');
    const distTexto = document.getElementById('distancia-texto');
    const badge = document.getElementById('status-badge');

    const comprimentoTotal = caminho.getTotalLength();
    let progresso = 0;

    function animarCaminhao() {
      progresso += 1.4;
      if (progresso > comprimentoTotal) {
        progresso = 0;
      }

      const ponto = caminho.getPointAtLength(progresso);
      caminhao.setAttribute('transform', `translate(${ponto.x}, ${ponto.y})`);

      const percentual = progresso / comprimentoTotal;
      const minutos = Math.max(0, Math.ceil((1 - percentual) * 5));
      const metros = Math.max(0, Math.round((1 - percentual) * 500));

      if (minutos === 0) {
        badge.textContent = '✓ CHEGOU NA SUA RUA';
        tempoTexto.textContent = 'Caminhão na sua porta!';
        distTexto.textContent = 'Coloque o lixo para fora agora.';
      } else {
        badge.textContent = '● EM ROTA AGORA';
        tempoTexto.textContent = `Chega em ${minutos} min`;
        distTexto.textContent = `O caminhão está a ${metros} metros do seu ponto.`;
      }

      requestAnimationFrame(animarCaminhao);
    }

    function ativarAlerta() {
      const btn = document.getElementById('btn-notificar');
      btn.textContent = '✓ Aviso ativado para este endereço!';
      btn.style.background = '#166527';
    }

    animarCaminhao();
  </script>
</body>
</html>
